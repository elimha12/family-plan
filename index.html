:root {
  --night: #0e1a2b; --night-2: #16263c; --night-3: #22364f;
  --frost: #eef2f6; --paper: #ffffff; --line: #d5dde6; --line-2: #e4e9ef;
  --ink: #142235; --slate: #5a6a7e; --mute: #8592a3;
  --lamp: #f4a93b; --lamp-soft: #fde7c2; --lamp-deep: #b8731a;
  --ice: #a9c9e6; --red: #b9472f; --red-soft: #f6e0da; --green: #2f7a57; --green-soft: #dcefe5;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--frost); color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.hidden { display: none !important; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
p { margin: 0 0 0.8em; }
a { color: var(--ink); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--night); color: #dfe7f0; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 22px 22px 18px; overflow-y: auto; }
.rail .brand { font-family: var(--serif); font-size: 15px; color: #c9d6e4; line-height: 1.35; }
.rail .brand b { display: block; font-size: 21px; color: #fff; font-weight: 600; margin-bottom: 2px; }
.house { margin: 18px -6px 10px; }
.house svg { width: 100%; height: auto; display: block; }
.house .win { fill: #1d2f47; transition: fill .6s ease; }
.house .win.lit { fill: var(--lamp); }
.house .glow { opacity: 0; transition: opacity .8s ease; }
.house .glow.lit { opacity: 1; }
.house-caption { font-size: 13px; color: #9fb0c4; margin: 0 0 14px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { margin: 2px 0; }
.steps button { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; background: none; border: 0; color: #c3d0de; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 15px; }
.steps button:hover { background: var(--night-2); color: #fff; }
.steps button.on { background: var(--night-3); color: #fff; }
.steps .num { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #3b5170; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #9fb0c4; }
.steps .done .num { background: var(--lamp); border-color: var(--lamp); color: var(--night); }
.steps .tick { font-size: 12px; color: var(--lamp); }
.rail .spacer { flex: 1; }
.rail .foot { font-size: 12px; color: #7f91a7; line-height: 1.45; border-top: 1px solid var(--night-3); padding-top: 12px; margin-top: 16px; }
.rail .foot button { background: none; border: 0; color: #c3d0de; padding: 0; text-decoration: underline; cursor: pointer; font-size: 12px; }

.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 40px; background: rgba(238, 242, 246, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line-2); }
.savestate { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--slate); min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mute); flex: none; }
.dot.ok { background: var(--green); } .dot.warn { background: var(--lamp); } .dot.bad { background: var(--red); }
.savestate span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .actions { display: flex; gap: 8px; flex: none; }
.content { max-width: 820px; padding: 34px 40px 120px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; border-radius: 8px; padding: 10px 16px; font-weight: 600; font-size: 15px; cursor: pointer; background: var(--night); color: #fff; line-height: 1.2; }
.btn:hover { background: var(--night-3); }
.btn.lamp { background: var(--lamp); color: var(--night); }
.btn.lamp:hover { background: #f7b95a; }
.btn.quiet { background: var(--paper); color: var(--ink); border-color: var(--line); }
.btn.quiet:hover { border-color: var(--slate); }
.btn.small { padding: 7px 12px; font-size: 14px; }
.btn.link { background: none; color: var(--slate); padding: 6px 4px; font-weight: 500; text-decoration: underline; }
.btn.danger { background: none; color: var(--red); border-color: transparent; padding: 6px 8px; font-weight: 500; }

/* ---------- fact band (slides inside a step) ---------- */
.band { position: relative; background: var(--night); color: #e7eef6; border-radius: 14px; padding: 30px 34px 26px; margin: 0 0 30px; overflow: hidden; min-height: 196px; }
.band::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(244,169,59,0.28), rgba(244,169,59,0) 70%); pointer-events: none; }
.band .slide { display: none; max-width: 560px; }
.band .slide.on { display: block; animation: bandIn .45s ease; }
@keyframes bandIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.band q { display: block; font-family: var(--serif); font-size: 27px; line-height: 1.28; quotes: none; color: #fff; }
.band .src { font-size: 13px; color: #9fb0c4; margin-top: 12px; }
.band .ctrl { position: absolute; right: 22px; bottom: 18px; display: flex; gap: 6px; align-items: center; }
.band .ctrl button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #3b5170; background: none; color: #dfe7f0; cursor: pointer; font-size: 15px; }
.band .ctrl button:hover { border-color: var(--lamp); color: var(--lamp); }
.band .pips { display: flex; gap: 5px; margin-right: 6px; }
.band .pips i { width: 6px; height: 6px; border-radius: 50%; background: #3b5170; }
.band .pips i.on { background: var(--lamp); }

/* ---------- step header & forms ---------- */
.stephead { margin-bottom: 22px; }
.stephead .kick { font-size: 14px; color: var(--slate); margin-bottom: 4px; }
.stephead h1 { font-size: 38px; line-height: 1.12; }
.stephead p { color: var(--slate); max-width: 62ch; margin-top: 10px; font-size: 17px; }
.group { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; margin-bottom: 18px; }
.group > h2 { font-size: 21px; margin-bottom: 4px; }
.group > .lede { color: var(--slate); font-size: 15px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 16px; }
.f { display: flex; flex-direction: column; gap: 5px; grid-column: span 3; min-width: 0; }
.f.w2 { grid-column: span 2; } .f.w4 { grid-column: span 4; } .f.w6 { grid-column: span 6; } .f.w1 { grid-column: span 1; }
.f > label, .f > .lab { font-size: 14px; font-weight: 600; color: var(--ink); }
.f .hint { font-size: 13px; color: var(--slate); }
input[type=text], input[type=tel], input[type=email], input[type=number], input[type=date], select, textarea { width: 100%; background: #fbfcfd; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 16px; }
input:focus, select:focus, textarea:focus { border-color: var(--night-3); background: #fff; outline: none; box-shadow: 0 0 0 3px rgba(244,169,59,0.35); }
textarea { min-height: 72px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip { border: 1px solid var(--line); background: #fbfcfd; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 15px; }
.seg button:hover, .chip:hover { border-color: var(--slate); }
.seg button.on, .chip.on { background: var(--night); border-color: var(--night); color: #fff; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--night); flex: none; }

.item { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; background: #fff; }
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
.item-head h3 { font-size: 19px; }
.sub { border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 14px; }
.sub h4 { margin: 0 0 8px; font-size: 15px; }
.medrow { display: grid; grid-template-columns: 2fr 1fr 1.3fr 1.2fr 1.2fr auto; gap: 8px; margin-bottom: 8px; align-items: end; }
.medrow .f { grid-column: auto; }
.note { background: var(--lamp-soft); border-radius: 10px; padding: 12px 16px; font-size: 15px; margin: 6px 0 16px; }
.note.cool { background: #e3edf7; }
.note.warn { background: var(--red-soft); }
.nav { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; gap: 12px; }

/* ---------- results ---------- */
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
.level { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 16px 16px 14px; cursor: pointer; }
.level:hover { border-color: var(--slate); }
.level.on { border-color: var(--night); box-shadow: inset 0 0 0 1.5px var(--night); }
.level b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 600; }
.level span { font-size: 14px; color: var(--slate); }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 6px 0 4px; }
.stat { background: var(--night); color: #fff; border-radius: 12px; padding: 18px 18px 16px; }
.stat .n { font-family: var(--serif); font-size: 44px; line-height: 1; font-weight: 600; color: var(--lamp); font-variant-numeric: lining-nums; }
.stat .t { font-size: 14px; color: #c3d0de; margin-top: 8px; line-height: 1.4; }
.gauge { display: grid; grid-template-columns: 160px 1fr 120px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 15px; }
.gauge:last-child { border-bottom: 0; }
.gauge .bar { height: 10px; border-radius: 6px; background: var(--line-2); overflow: hidden; }
.gauge .bar i { display: block; height: 100%; background: var(--lamp); border-radius: 6px; }
.gauge .bar i.full { background: var(--green); }
.gauge .v { text-align: right; color: var(--slate); font-variant-numeric: tabular-nums; }
.spots { margin: 0; padding: 0; list-style: none; counter-reset: sp; }
.spots li { counter-increment: sp; display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.spots li:last-child { border: 0; }
.spots li::before { content: counter(sp); font-family: var(--serif); font-size: 24px; font-weight: 600; color: var(--lamp-deep); line-height: 1.1; }
.spots b { display: block; }
.spots span { color: var(--slate); font-size: 15px; }
.week { margin-bottom: 18px; }
.week h3 { font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.week h3 small { font-family: var(--sans); font-size: 14px; color: var(--slate); font-weight: 500; }
.week h4 { font-size: 13px; color: var(--slate); margin: 12px 0 4px; font-weight: 600; }
.todo { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 8px 0; align-items: start; font-size: 15px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.todo input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--green); }
.todo .ch { font-size: 12px; color: var(--mute); white-space: nowrap; }
.todo.is-done span:first-of-type { color: var(--mute); text-decoration: line-through; }
table.shop { width: 100%; border-collapse: collapse; font-size: 15px; }
table.shop th { text-align: left; font-size: 13px; color: var(--slate); font-weight: 600; padding: 6px 8px; border-bottom: 1.5px solid var(--line); }
table.shop td { padding: 9px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.shop td.tot { font-weight: 600; white-space: nowrap; }
table.shop td.c { color: var(--mute); font-size: 13px; white-space: nowrap; }

/* ---------- export cards ---------- */
.out { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.outcard { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.outcard h3 { font-size: 20px; }
.outcard p { color: var(--slate); font-size: 15px; flex: 1; margin: 0; }
.outcard .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.outcard.feature { grid-column: span 2; background: var(--night); color: #fff; border-color: var(--night); }
.outcard.feature p { color: #c3d0de; }
.steps-mini { margin: 6px 0 0; padding-left: 20px; color: #c3d0de; font-size: 15px; }
.steps-mini li { margin: 3px 0; }

/* ---------- deck (full-screen slides) ---------- */
.deck { position: fixed; inset: 0; z-index: 100; background: var(--night); color: #fff; display: flex; flex-direction: column; }
.deck .stage { flex: 1; display: grid; place-items: center; padding: 40px 8vw; overflow: hidden; position: relative; }
.deck .stage::before { content: ""; position: absolute; left: 50%; bottom: -40vh; width: 120vh; height: 80vh; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(244,169,59,0.16), rgba(244,169,59,0)); pointer-events: none; }
.deck .sl { display: none; width: min(980px, 100%); position: relative; }
.deck .sl.on { display: block; animation: slIn .55s cubic-bezier(.2,.7,.2,1); }
@keyframes slIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.deck .k { font-size: 16px; color: #9fb0c4; margin-bottom: 18px; }
.deck h2 { font-size: clamp(36px, 5.6vw, 72px); line-height: 1.06; font-weight: 600; letter-spacing: -0.02em; }
.deck .huge { font-family: var(--serif); font-size: clamp(90px, 17vw, 220px); line-height: 0.9; color: var(--lamp); font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: lining-nums; }
.deck .huge small { font-size: 0.28em; color: #fff; letter-spacing: 0; margin-left: 0.15em; }
.deck p.lead { font-size: clamp(18px, 2vw, 23px); color: #c9d6e4; max-width: 46ch; margin-top: 22px; line-height: 1.5; }
.deck .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 34px; }
.deck .cols div { border-top: 2px solid var(--lamp); padding-top: 14px; }
.deck .cols b { display: block; font-family: var(--serif); font-size: 24px; font-weight: 600; margin-bottom: 6px; }
.deck .cols span { color: #c3d0de; font-size: 16px; line-height: 1.45; }
.deck .src { font-size: 14px; color: #7f91a7; margin-top: 26px; }
.deck .bottom { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; gap: 12px; }
.deck .pips { display: flex; gap: 7px; }
.deck .pips i { width: 26px; height: 3px; border-radius: 2px; background: #2c4261; }
.deck .pips i.on { background: var(--lamp); }
.deck .bottom .nb { display: flex; gap: 8px; }
.deck .bottom button { border: 1px solid #3b5170; background: none; color: #fff; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
.deck .bottom button.go { background: var(--lamp); border-color: var(--lamp); color: var(--night); }
.deck .x { position: absolute; top: 18px; right: 22px; z-index: 2; background: none; border: 1px solid #3b5170; color: #c3d0de; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; }
.deck .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 14px; align-items: center; margin-top: 34px; }
.deck .flow .bx { border: 1.5px solid #3b5170; border-radius: 12px; padding: 16px; font-size: 16px; color: #dfe7f0; }
.deck .flow .bx b { display: block; font-family: var(--serif); font-size: 19px; color: #fff; margin-bottom: 4px; font-weight: 600; }
.deck .flow .ar { color: var(--lamp); font-size: 26px; }
.deck .meet { margin-top: 30px; display: grid; gap: 14px; }
.deck .meet div { display: grid; grid-template-columns: 220px 1fr; gap: 20px; font-size: 22px; border-bottom: 1px solid #2c4261; padding-bottom: 12px; }
.deck .meet span { color: #9fb0c4; font-size: 17px; }

/* ---------- banners & toast ---------- */
.banner { display: flex; gap: 14px; align-items: center; justify-content: space-between; background: var(--lamp-soft); border: 1px solid #f0d29e; border-radius: 12px; padding: 14px 18px; margin-bottom: 22px; font-size: 15px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--night); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 15px; opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 200; max-width: 90vw; }
.toast.on { opacity: 1; transform: translateX(-50%); }

/* ---------- mobile ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: relative; height: auto; padding: 16px; }
  .rail .house, .rail .house-caption, .rail .spacer, .rail .foot { display: none; }
  .steps { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; }
  .steps li { flex: none; }
  .steps button { grid-template-columns: 24px auto; font-size: 14px; padding: 7px 10px; }
  .steps .tick { display: none; }
  .topbar { padding: 10px 16px; flex-wrap: wrap; }
  .content { padding: 22px 16px 90px; }
  .stephead h1 { font-size: 30px; }
  .band { padding: 22px 20px 56px; }
  .band q { font-size: 22px; }
  .grid { grid-template-columns: 1fr 1fr; }
  .f, .f.w2, .f.w4, .f.w6 { grid-column: span 2; } .f.w1 { grid-column: span 1; }
  .medrow { grid-template-columns: 1fr 1fr; }
  .levels, .big, .out { grid-template-columns: 1fr; }
  .outcard.feature { grid-column: auto; }
  .gauge { grid-template-columns: 1fr; gap: 4px; }
  .gauge .v { text-align: left; }
  .deck .cols, .deck .flow { grid-template-columns: 1fr; }
  .deck .flow .ar { transform: rotate(90deg); justify-self: center; }
  .deck .meet div { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- print (the family binder) ---------- */
#print { display: none; }
@page { size: letter; margin: 0.6in 0.65in 0.6in 0.75in; }
@media print {
  body { background: #fff; }
  .app, .deck, .toast { display: none !important; }
  #print { display: block; color: #000; font: 11pt/1.42 var(--sans); }
  .pg { page-break-after: always; break-after: page; position: relative; }
  .pg.cover { min-height: 9.3in; }
  .pg:last-child { page-break-after: auto; break-after: auto; }
  .pg h1 { font-family: var(--serif); font-size: 24pt; margin: 0 0 4pt; }
  .pg h2 { font-family: var(--serif); font-size: 14pt; margin: 14pt 0 5pt; }
  .pg h2, .pg h1 { break-after: avoid; page-break-after: avoid; }
  .pg .cb, .pg tr, .wcard { break-inside: avoid; page-break-inside: avoid; }
  .pg .meta { font-size: 9.5pt; color: #444; margin-bottom: 12pt; }
  .pg table { width: 100%; border-collapse: collapse; margin: 4pt 0 8pt; font-size: 10.5pt; }
  .pg th, .pg td { border: 0.75pt solid #777; padding: 5pt 6pt; text-align: left; vertical-align: top; }
  .pg th { background: #eee; font-weight: 600; }
  .pg td.blank { height: 22pt; }
  .pg .foot { margin-top: 16pt; font-size: 8.5pt; color: #555; border-top: 0.5pt solid #999; padding-top: 4pt; }
  .pg .cb { font-size: 12pt; margin: 5pt 0; display: grid; grid-template-columns: 18pt 1fr auto; }
  .pg .cb em { font-style: normal; color: #555; font-size: 9pt; }
  .pg .fill { border-bottom: 0.75pt solid #000; display: inline-block; min-width: 2.2in; padding: 0 4pt; }
  .cover { display: flex; flex-direction: column; justify-content: center; }
  .cover h1 { font-size: 40pt; line-height: 1.05; }
  .cover .house-print svg { width: 3.2in; }
  .cards { display: grid; grid-template-columns: 3.5in 3.5in; gap: 0.25in; }
  .wcard { border: 1pt dashed #000; height: 2.15in; padding: 7pt 9pt; font-size: 8.5pt; line-height: 1.35; overflow: hidden; }
  .wcard b { font-size: 9pt; }
  .med td:first-child { width: 1.8in; font-weight: 600; }
  .bignum { font-family: var(--serif); font-size: 26pt; font-weight: 600; }
  .glance { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8pt; margin: 6pt 0 10pt; }
  .glance div { border: 1pt solid #000; padding: 8pt; }
  .glance span { font-size: 9.5pt; }
}
</style>
</head>

<script>
"use strict";
/* Clear anything a browser "Save page as" may have kept, then capture the clean page source.
   Saving writes this source back out with the plan inside. */
["content", "steps", "print"].forEach(id => { const e = document.getElementById(id); if (e) e.innerHTML = ""; });
(() => { const d = document.getElementById("deck"); d.innerHTML = ""; d.className = "deck hidden"; d.removeAttribute("data-end"); document.getElementById("toast").className = "toast"; })();
const SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML;
const BUILDER_VERSION = "1.0";

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const has = v => v !== undefined && v !== null && String(v).trim() !== "";
const uid = () => Math.random().toString(36).slice(2, 10);
const plural = (n, a, b) => `${n.toLocaleString("en-US")} ${n === 1 ? a : (b || a + "s")}`;
function getP(o, path) { return path.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
function setP(o, path, v) { const ks = path.split("."); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 3200); }
const fmtDate = (d, o = { month: "short", day: "numeric" }) => d.toLocaleDateString("en-US", o);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseDate = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function nthSunday(year, month, n) { const d = new Date(year, month, 1); const first = (7 - d.getDay()) % 7; return new Date(year, month, 1 + first + 7 * (n - 1)); }
function nextClockChanges(from = new Date()) {
  const out = []; for (let y = from.getFullYear(); out.length < 2; y++) {
    const s = nthSunday(y, 2, 2), f = nthSunday(y, 10, 1);
    if (s >= from) out.push({ d: s, label: "Spring clock change" }); if (out.length < 2 && f >= from) out.push({ d: f, label: "Fall clock change" }); }
  return out;
}

function counts() {

  const levels = Math.max(1, num(S.home.levels) || 1), beds = Math.max(1, num(S.home.bedrooms) || 1);
  return { P, ppl, pets, Pt: pets.length, adults, levels, beds, away: ppl.filter(p => p.away).length, cars: num(S.home.cars) };
}

function stepDone(id) {
  const h = S.home, hv = S.have;
  if (id === "home") return has(h.family) && has(h.type) && has(h.heat);
  if (id === "people") return S.people.some(p => has(p.name));
  if (id === "pets") return S.noPets || S.pets.some(p => has(p.name));
  if (id === "reach") return has(S.reach.oos.name) && has(S.reach.oos.cell) && has(S.reach.places.near.name);
  if (id === "supplies") return has(hv.water) && has(hv.foodDays) && has(hv.flashlights);

}

/* ================= render & events ================= */
function render() {
  const el = $("#content"); const y = window.scrollY;
  let banner = "";
  const draft = BOOT_DRAFT;
  if (draft && draft.t > (S.saved ? Date.parse(S.saved) : 0) + 1000 && !render.ignored) banner = `<div class="banner"><span>We found changes from ${new Date(draft.t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} that weren't saved to your file.</span><span><button class="btn small" data-act="restore">Restore them</button> <button class="btn link" data-act="ignore">Ignore</button></span></div>`;
  if (LOADED_FROM_FILE && !render.welcomed && step === "plan") banner += `<div class="banner" style="background:#e3edf7;border-color:#c9dbee"><span>Welcome back${has(S.home.family) ? ", " + esc(S.home.family) + " family" : ""}. Your plan was last saved ${S.saved ? new Date(S.saved).toLocaleString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "earlier"}.</span><button class="btn link" data-act="welcomed">Dismiss</button></div>`;
  if (!LOADED_FROM_FILE && !has(S.home.family) && !S.people.length && step === "home") banner += `<div class="banner" style="background:#e3edf7;border-color:#c9dbee"><span><b>Already made a plan?</b> Open your saved plan file, for example <i>The_Miller_Family_Plan.html</i>, and everything comes back.</span><button class="btn small" data-act="import">Open my plan file</button></div>`;
  if (LOADED_FROM_FILE && !render.welcomed && step === "plan" && "showSaveFilePicker" in window && !fileHandle) banner += `<div class="banner"><span>To keep saving into this same file, click <b>Turn on auto-save</b> and choose this file. Your browser will ask to replace it; say yes.</span><button class="btn small lamp" data-act="autosave">Turn on auto-save</button></div>`;
  el.innerHTML = banner + VIEW[step]();
  drawRail(); updateSave();
  render.keepScroll ? window.scrollTo(0, y) : window.scrollTo(0, 0); render.keepScroll = false;
}
function syncDom() { $("#plan-data").textContent = JSON.stringify(S).replace(/</g, "\\u003c"); document.title = has(S.home.family) ? `The ${S.home.family} Family Plan` : "Family Plan Builder · 72 Hours to 6 Months"; }

/* ================= calendar (.ics) ================= */
function calendar() {
  const t = targets(), now = new Date(), sd = startDate(), ev = [];
  const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const enc = new TextEncoder();
  const fold = line => { const out = []; let cur = "", n = 0, lim = 75; for (const ch of line) { const b = enc.encode(ch).length; if (n + b > lim) { out.push(cur); cur = " "; n = 1; lim = 75; } cur += ch; n += b; } out.push(cur); return out.join("\r\n"); };
  const dstamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ymd = d => isoDate(d).replace(/-/g, "");
  function add(title, date, desc, rrule) {
    const L = ["BEGIN:VEVENT", `UID:${uid()}-${ymd(date)}@familyplan`, `DTSTAMP:${dstamp}`, `DTSTART;VALUE=DATE:${ymd(date)}`, `DTEND;VALUE=DATE:${ymd(addDays(date, 1))}`, `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc + "\n\nFrom your Family Plan (72 Hours to 6 Months). Educational only; follow local officials.")}`];
    if (rrule) L.push("RRULE:" + rrule);
    L.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(title)}`, "TRIGGER:-PT15H", "END:VALARM", "END:VEVENT"); ev.push(L.map(fold).join("\r\n"));
  }
  plan30().forEach(wk => add(`Family plan, week ${wk.w}: ${wk.title}`, addDays(sd, wk.days[0]), wk.groups.flatMap(g => g[1]).map(x => "☐ " + x[1] + " (Ch. " + x[2] + ")").join("\n")));
  let m = new Date(now.getFullYear(), now.getMonth() + 1, 1); while (m.getDay() !== 6) m = addDays(m, 1);
  add("Monthly: test the alarms", m, "Test smoke alarms (USFA) and CO alarms (CPSC). Eat from the working pantry and restock what you use. Keep the gas tank at least half full (Ready.gov).", "FREQ=MONTHLY;BYDAY=1SA");
  const cc = "Replace self-filled water. Check dates on food, medicine, and first aid supplies. Test flashlights and radios. Check CO alarm batteries (CDC). Charge power banks and power stations, and test-run the generator outdoors. Count the cash envelope. Review the grab file, medication lists, and plan card. Update the skills map. Check your car for open recalls.";
  nextClockChanges(now).forEach(x => add(`Clock-change weekend: 6-month check`, x.d, cc, x.d.getMonth() === 2 ? "FREQ=YEARLY;BYMONTH=3;BYDAY=2SU" : "FREQ=YEARLY;BYMONTH=11;BYDAY=1SU"));
  add("Yearly: rethink our plan", addDays(sd, 365), "Rethink each person's needs (Ready.gov). Replace 9-volt smoke alarm batteries (USFA). Practice the communication plan (FEMA). Have the chimney checked, the heating system serviced, and the car's exhaust checked (CDC). Check kids' bag sizes and your pet's microchip details.", "FREQ=YEARLY");
  const hv = S.have, yr = now.getFullYear();
  if (num(hv.coYear) > 1990) { const y = num(hv.coYear) + 5; add("Replace the CO alarms", new Date(Math.max(y, yr), 0, 15), "CO alarms are due for replacement (every 5 years, or follow the maker's date; CDC)."); }
  if (num(hv.smokeYear) > 1990) { const y = num(hv.smokeYear) + 10; add("Replace the smoke alarms", new Date(Math.max(y, yr), 0, 15), "Smoke alarms are due for replacement every 10 years (USFA)."); }
  if (has(hv.waterDate)) { const d = addDays(parseDate(hv.waterDate), 182); if (d > now) add("Replace self-filled water", d, "Water you bottle yourself gets replaced every 6 months (Chapter 6)."); }
  S.people.forEach(p => (p.meds || []).forEach(md => { if (has(md.refill) && has(md.name)) add(`Refill: ${md.name} (${p.name || "family"})`, parseDate(md.refill), `Refill due for ${p.name || ""}: ${md.name}${has(md.dose) ? ", " + md.dose : ""}.`); }));
  const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//72 Hours to 6 Months//Family Plan Builder//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Our Family Plan", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";
  dl(new Blob([body], { type: "text/calendar" }), fileName().replace(/\.html$/, "_Reminders.ics")); toast(`Calendar file ready: ${ev.length} reminders.`);
}

/* ================= the printed binder ================= */
function printBinder() {
  const t = targets(), c = t.c, r = S.reach, pl = r.places || {}, sd = startDate(), fam = has(S.home.family) ? `The ${esc(S.home.family)} Family Plan` : "Our Family Plan";
  const today = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  const foot = s => `<div class="foot">${fam} · ${s} · Updated ${today} · Educational only; follow local officials.</div>`;
  const cell = v => has(v) ? esc(v) : "";
  const tr = (cells, blank) => `<tr>${cells.map(v => `<td class="${blank && !has(v) ? "blank" : ""}">${cell(v)}</td>`).join("")}</tr>`;
  const ppl = c.ppl.length ? c.ppl : [{}];
  const spots = weakSpots().slice(0, 3);
  let h = "";
  h += `<section class="pg cover"><div class="house-print">${document.querySelector(".house").innerHTML}</div><h1>${fam}</h1><p style="font-size:14pt;margin-top:8pt">${has(S.home.city) ? esc(S.home.city) + (has(S.home.state) ? ", " + esc(S.home.state) : "") + " · " : ""}${plural(c.P, "person", "people")}${c.Pt ? `, ${plural(c.Pt, "pet")}` : ""}</p><p style="margin-top:18pt">Updated ${today}. Keep one copy on the fridge and one in the go-bags.</p><p style="margin-top:40pt;font-size:10pt;color:#444">Made with the Family Plan Builder, a companion to <i>72 Hours to 6 Months</i> by Jason Adler. Educational only. Follow local officials. Not medical, legal, or financial advice.</p></section>`;
  h += `<section class="pg"><h1>Our plan at a glance</h1><div class="meta">Goal: ${LEVELS[t.L].name}, ${LEVELS[t.L].title.toLowerCase()} (${LEVELS[t.L].money}). Week 1 starts ${fmtDate(sd, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}.</div>
    <div class="glance"><div><div class="bignum">${t.water} gal</div><span>Water: 1 gallon per person${c.Pt ? " and pet" : ""} per day. About ${t.containers} five-gallon containers.</span></div><div><div class="bignum">${t.L === "3" ? "3–6 mo" : t.foodDays + " days"}</div><span>Food per person. Planning figure: 2,000 calories a day.</span></div><div><div class="bignum">$${t.cash}</div><span>Cash in small bills: ones, fives, and tens.</span></div></div>
    <h2>Where we stand</h2><table><tr><th>Item</th><th>We have</th><th>Target</th></tr>${[["Water (gallons)", S.have.water, t.water], ["Food (days)", S.have.foodDays, t.foodDays], ["Flashlights", S.have.flashlights, t.flashlights], ["CO alarms", S.have.coCount, `${t.co}+ (every level, near sleeping areas)`], ["Smoke alarms", S.have.smokeCount, `${t.smoke}+ (in and outside sleeping areas, every level)`], ["Cash", has(S.have.cash) ? "$" + S.have.cash : "", "$" + t.cash], ["Go-bags", S.have.gobags, t.gobags]].map(x => tr(x)).join("")}</table>
    <h2>Our first three weak spots</h2>${spots.length ? `<table>${spots.map((s, i) => `<tr><td style="width:18pt">${i + 1}</td><td><b>${esc(s.t)}</b><br>${esc(s.d)}</td><td style="width:40pt">Ch. ${s.ch}</td></tr>`).join("")}</table>` : "<p>None from our answers.</p>"}${foot("At a glance")}</section>`;
  h += `<section class="pg"><h1>Family Communication Plan</h1><div class="meta">Post this page on the refrigerator. Text first. Wait 10 seconds before you redial. Call 911 by voice whenever you can.</div>
    <h2>Household</h2><table><tr><th>Name</th><th>Cell</th><th>Other contact</th><th>Medical (see cards)</th></tr>${ppl.map(p => tr([p.name, p.cell, p.email, [p.conditions, p.allergies && "Allergies: " + p.allergies].filter(Boolean).join("; ")], true)).join("")}</table>
    <h2>Out-of-state contact</h2><table><tr><th>Name</th><th>Cell</th><th>Second way</th><th>Address</th></tr>${tr([r.oos?.name, r.oos?.cell, r.oos?.alt, r.oos?.address], true)}</table>
    <h2>ICE contact (saved as “ICE” in every phone)</h2><table><tr><th>Name</th><th>Cell</th><th>Home</th><th>Address</th></tr>${tr([r.ice?.name, r.ice?.cell, r.ice?.home, r.ice?.address], true)}</table>
    <h2>Meeting places</h2><table><tr><th>Where</th><th>Place</th><th>Address or directions</th></tr>${tr(["Neighborhood spot", pl.near?.name, pl.near?.addr], true)}${tr(["Outside the neighborhood", pl.out?.name, pl.out?.addr], true)}${tr(["Out of town (Destination A)", pl.town?.name, pl.town?.addr], true)}${tr(["Indoor room, high winds", pl.room, ""], true)}</table>
    ${has(r.destB) || has(r.destC) || has(r.trigger) ? `<p>Destination B: ${cell(r.destB)} · Destination C: ${cell(r.destC)} · Trigger for leaving: ${cell(r.trigger)}</p>` : ""}
    <h2>Schools, child care, and workplaces</h2><table><tr><th>Name</th><th>Emergency number</th><th>Pickup plan</th></tr>${(r.schools?.length ? r.schools : [{}, {}]).map(s => tr([s.name, s.phone, s.pickup], true)).join("")}</table>${foot("Fridge page, 1 of 2")}</section>`;
  const N = r.numbers || {};
  h += `<section class="pg"><h1>Family Communication Plan</h1><div class="meta">Fridge page, back side.</div>
    <h2>Important numbers</h2><table><tr><th></th><th>Name</th><th>Phone</th></tr>${[["Doctor", "doctor"], ["Pharmacy", "pharmacy"], ["Veterinarian", "vet"], ["Power company", "power"], ["Gas company", "gas"], ["Water utility", "water"], ["Insurance", "insurance"]].map(([l, k]) => tr([l, N[k]?.name, N[k]?.phone], true)).join("")}</table>
    <h2>Alerts and radio</h2><table>${tr(["Wireless Emergency Alerts on every phone", r.wea || "☐ Yes ☐ No"])}${tr(["Local alert systems", r.localAlerts], true)}${tr(["County NOAA SAME code", r.same], true)}${tr(["FRS or GMRS channel", r.frs], true)}${tr(["Check-in times", r.checkins], true)}</table>
    ${r.codesOn ? `<h2>Code words (home copy only)</h2><table>${[["GREEN", "green"], ["YELLOW", "yellow"], ["RED", "red"], ["Pickup word", "pickup"], ["Meeting word: neighborhood", "mNear"], ["Meeting word: outside the neighborhood", "mOut"], ["Meeting word: out of town", "mTown"]].map(([l, k]) => tr([l, r.codes?.[k]], true)).join("")}</table>` : ""}${foot("Fridge page, 2 of 2")}</section>`;
  const wc = p => `<div class="wcard"><b>${cell(p.name) || "Name: ________________"}</b>${has(p.cell) ? " · " + esc(p.cell) : ""}<br>Out-of-state contact: ${cell(r.oos?.name)} ${cell(r.oos?.cell)}<br>Second way: ${cell(r.oos?.alt)}<br>ICE: ${cell(r.ice?.name)} ${cell(r.ice?.cell)}<br><b>Meet:</b> ${cell(pl.near?.name)}<br>Outside the neighborhood: ${cell(pl.out?.name)}<br>Out of town: ${cell(pl.town?.name)}<br><i>Text first. Wait 10 seconds before you redial.</i></div>`;
  for (let i = 0; i < ppl.length; i += 8) h += `<section class="pg"><h1>Wallet cards</h1><div class="meta">Cut along the dashed lines. One per person. No code words on these cards.</div><div class="cards">${ppl.slice(i, i + 8).map(wc).join("")}</div>${foot("Wallet cards")}</section>`;
  ppl.forEach(p => { const meds = (p.meds || []).length ? p.meds : [{}, {}, {}];
    h += `<section class="pg med"><h1>Medical card: ${cell(p.name) || "________"}</h1><div class="meta">Three copies: go-bag or medical bag, fridge door, wallet. Update all three whenever a dose changes.</div>
      <table>${tr(["Name", p.name], true)}${tr(["Date of birth", p.dob], true)}${tr(["Medical conditions", p.conditions], true)}${tr(["Allergies", p.allergies], true)}</table>
      <h2>Medicines</h2><table><tr><th>Medicine</th><th>Dose</th><th>Times taken</th><th>Prescriber</th><th>Next refill</th></tr>${meds.map(m => tr([m.name, m.dose, m.times, m.prescriber, m.refill], true)).join("")}</table>
      <h2>Doctor and pharmacy</h2><table>${tr(["Doctor", (N.doctor?.name || "") + " " + (N.doctor?.phone || "")], true)}${tr(["Pharmacy", (N.pharmacy?.name || "") + " " + (N.pharmacy?.phone || "")], true)}</table>
      ${p.device ? `<h2>Medical device</h2><table><tr><th>Device</th><th>Make and model</th><th>Serial</th><th>Supplier and phone</th></tr>${tr([p.dev?.name, p.dev?.model, p.dev?.serial, p.dev?.supplier], true)}</table>` : ""}
      <h2>Insurance and emergency contacts</h2><table>${tr(["Insurance", [p.insurer, p.member && "Member # " + p.member].filter(Boolean).join(" · ")], true)}${tr(["Local contact (ICE)", [r.ice?.name, r.ice?.cell].filter(Boolean).join(" · ")], true)}${tr(["Out-of-state contact", [r.oos?.name, r.oos?.cell].filter(Boolean).join(" · ")], true)}</table>${foot("Medical card · Chapter 11")}</section>`; });
  if (c.Pt) h += `<section class="pg"><h1>Our pets</h1><div class="meta">If local officials ask you to evacuate, your pet should evacuate too (FEMA, Ready.gov).</div><table><tr><th>Name</th><th>Kind</th><th>Breed and color</th><th>Medicines</th><th>Microchip</th><th>Carrier</th><th>Photo together</th></tr>${c.pets.map(p => tr([p.name, p.kind, p.breed, p.meds, p.chip, p.carrier ? "Yes" : "☐", p.photo ? "Yes" : "☐"])).join("")}</table>
    <p>Water: ${14 * c.Pt} gallons for 2 weeks (this book's planning figure; ask your vet). Vet: ${cell(N.vet?.name)} ${cell(N.vet?.phone)}</p>${foot("Pets · Chapter 5")}</section>`;
  h += `<section class="pg"><h1>Our 30 days</h1><div class="meta">Fall behind without quitting. A missed week just slides the calendar.</div>${plan30().map(wk => `<h2>Week ${wk.w}: ${wk.title} (${fmtDate(addDays(sd, wk.days[0]))} – ${fmtDate(addDays(sd, wk.days[1]))})</h2>${wk.groups.flatMap(g => g[1]).map(([k, txt, ch]) => `<div class="cb"><span>${S.done[k] ? "☑" : "☐"}</span><span>${esc(txt)}</span><em>Ch. ${ch}</em></div>`).join("")}`).join("")}${foot("30-Day Action Plan · Chapter 15")}</section>`;
  h += `<section class="pg"><h1>Shopping list: ${LEVELS[t.L].name}, ${LEVELS[t.L].title}</h1><div class="meta">${LEVELS[t.L].money}. Totals for ${plural(c.P, "person", "people")}${c.Pt ? ` and ${plural(c.Pt, "pet")}` : ""}. No brands, no prices.</div><table><tr><th>Item</th><th>How much</th><th>Our total</th><th>☐</th><th>Ch.</th></tr>${shopping().map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td><b>${esc(x[2])}</b></td><td>☐</td><td>${x[3]}</td></tr>`).join("")}</table>${foot("Shopping list · Bonus #5")}</section>`;
  const cc = nextClockChanges();
  h += `<section class="pg"><h1>Keeping it working</h1><div class="meta">Next clock changes: ${cc.map(x => `${x.label.toLowerCase()} ${fmtDate(x.d, { month: "long", day: "numeric", year: "numeric" })}`).join("; ")}.</div><table><tr><th>How often</th><th>What to do</th></tr>
    ${tr(["Every month", "Test smoke alarms (USFA) and CO alarms (CPSC). Eat from the working pantry and restock what you use. Keep the gas tank at least half full (Ready.gov)."])}
    ${tr(["Every 6 months (clock-change weekends)", "Replace self-filled water. Check dates on food, medicine, and first aid supplies. Test flashlights and radios. Check CO alarm batteries (CDC). Charge power banks and power stations, and test-run the generator outdoors. Count the cash envelope. Review the grab file, medication lists, and plan card. Update the skills map. Check your car for open recalls."])}
    ${tr(["Every year", "Rethink each person's needs (Ready.gov). Replace 9-volt smoke alarm batteries (USFA). Practice the communication plan (FEMA). Have the chimney checked, the heating system serviced, and the car's exhaust checked (CDC). Check kids' bag sizes and your pet's microchip details."])}
    ${tr(["Every 5 years", `Replace CO alarms, or follow the maker's date (CDC).${num(S.have.coYear) > 1990 ? " Ours are due in " + (num(S.have.coYear) + 5) + "." : ""}`])}
    ${tr(["Every 10 years", `Replace smoke alarms (USFA).${num(S.have.smokeYear) > 1990 ? " Ours are due in " + (num(S.have.smokeYear) + 10) + "." : ""}`])}
    ${tr(["After every use", "Restock what you used, the same week."])}</table>${foot("Maintenance · Bonus #13")}</section>`;
  h += `<section class="pg"><h1>Hour Zero Checklist</h1><div class="meta">Tape this page inside a kitchen cabinet.</div>
    <h2>0–10 min: People and hazards</h2>${["Grab a flashlight. Use candles only if you have nothing else.", "Check on every person and pet in the house.", "Check anyone who relies on a powered medical device or cold medicine.", "Look outside for downed lines, and keep everyone away from them.", "Keep generators, grills, and camp stoves outdoors, never in the garage."].map(s => `<div class="cb"><span>☐</span><span>${s}</span></div>`).join("")}
    <h2>10–20 min: How big is it?</h2>${["Confirm whether the outage covers just your home or the whole street.", "Turn on a battery-powered or hand-crank radio."].map(s => `<div class="cb"><span>☐</span><span>${s}</span></div>`).join("")}
    <h2>20–45 min: Protect what's running out</h2>${["Keep the fridge and freezer closed.", "Unplug computers, TVs, and other electronics.", "Dim your phone, turn on low-power mode, and text instead of calling.", "Fill clean containers with drinking water and the bathtub for flushing."].map(s => `<div class="cb"><span>☐</span><span>${s}</span></div>`).join("")}
    <h2>45–60 min: Plan for first light</h2><div class="cb"><span>☐</span><span>Plan gas, cash, and neighbor checks for daylight, once roads are safe.</span></div>${foot("Hour Zero · Chapter 3")}</section>`;
  $("#print").innerHTML = h;
  setTimeout(() => window.print(), 60);
}

/* ================= boot ================= */
const BOOT_DRAFT = readDraft();
syncDom();
render();
if (!S.seenIntro && !LOADED_FROM_FILE) setTimeout(() => openDeck(welcomeDeck()), 250);
</script>
</body>
</html>
