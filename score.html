:root { --bg: #0b0f17; --panel: #151d2b; --panel2: #1b2536; --line: #27334a; --ink: #f4ecdf; --dim: #a9b4c6; --faint: #6f7d93; --amber: #f4a93b; --amber2: #ffcf7a; --red: #ef8a73; --green: #8fd3a2; --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --serif: "Literata", Georgia, serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 18px/1.5 var(--sans); min-height: 100vh; min-height: 100dvh; }
button, a { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 8px; }
[tabindex="-1"]:focus { outline: none; }
#app { max-width: 600px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 18px 0; }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.brand { font-weight: 800; letter-spacing: .16em; font-size: 13px; color: var(--faint); }
.brand b { color: var(--amber); }
.screen { flex: 1; display: flex; flex-direction: column; padding-top: 10px; animation: in .3s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .bulb { animation: none !important; } }
.bar { position: sticky; bottom: 0; margin: auto -18px 0; padding: 14px 18px max(16px, env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(11,15,23,0)); display: flex; gap: 10px; }
.btn { flex: 1; min-height: 58px; border: 0; border-radius: 16px; background: var(--amber); color: #1a1205; font-weight: 800; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px; cursor: pointer; text-decoration: none; text-align: center; }
.btn.ghost { background: none; color: var(--ink); border: 1.5px solid var(--line); font-weight: 700; }
.btn.small { flex: 0 0 auto; }
.btn svg { width: 22px; height: 22px; flex: none; }
h1 { font: 700 42px/1.06 var(--serif); margin: 6px 0 12px; }
h2 { font: 700 29px/1.15 var(--serif); margin: 4px 0 10px; }
h3 { font: 700 20px/1.3 var(--sans); margin: 0 0 6px; }
p { margin: 0 0 12px; }
.lead { font-size: 20px; color: var(--dim); }
.kick { font-weight: 800; font-size: 13px; letter-spacing: .16em; color: var(--amber); text-transform: uppercase; }
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; margin: 0 0 12px; }
.muted { color: var(--dim); } .small { font-size: 15px; }
.bulb { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #ffd994 0, #f4a93b 30%, rgba(244,169,59,.12) 62%, rgba(244,169,59,0) 70%); margin: 18px 0 10px; animation: flick 6s infinite; }
@keyframes flick { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .2; } 94% { opacity: .9; } 95% { opacity: .15; } 97% { opacity: 1; } }
.prog { height: 6px; border-radius: 6px; background: var(--panel2); overflow: hidden; margin: 6px 0 18px; }
.prog i { display: block; height: 100%; background: var(--amber); transition: width .35s; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px 18px; font-weight: 700; font-size: 18px; cursor: pointer; }
.opt.on { border-color: var(--amber); background: #22190d; color: var(--amber2); }
.opt span { display: block; font-weight: 400; color: var(--dim); font-size: 15px; margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: center; margin: 6px 0 14px; }
.dial { position: relative; width: 150px; height: 150px; }
.dial svg { width: 150px; height: 150px; transform: rotate(-90deg); }
.dial .v { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.dial .v b { font: 700 52px/1 var(--serif); display: block; } .dial .v span { font-size: 13px; color: var(--dim); letter-spacing: .1em; }
.first { border-color: #5a3d14; background: #1d160c; }
.first b { color: var(--amber2); }
.fix { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.fix:first-of-type { border-top: 0; }
.fix .n { width: 34px; height: 34px; border-radius: 10px; background: #22190d; color: var(--amber); display: grid; place-items: center; font-weight: 800; }
.cta { display: grid; gap: 10px; margin: 6px 0 12px; } .cta .btn { font-size: 18px; }
.foot { color: var(--faint); font-size: 13px; text-align: center; padding: 16px 0 8px; line-height: 1.45; }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--panel2); border: 1.5px solid var(--line); padding: 12px 18px; border-radius: 14px; font-weight: 700; z-index: 9; }
@media (max-width: 380px) { h1 { font-size: 36px; } .score { grid-template-columns: 124px 1fr; } .dial, .dial svg { width: 124px; height: 124px; } .dial .v b { font-size: 42px; } }

  { k: "light", q: "Working flashlights or headlamps?", o: [["None, just phones"], ["Fewer than one per person"], ["At least one per person"]] },
  { k: "food", q: "Food you could eat without cooking or a fridge?", o: [["Less than a day"], ["1 to 2 days"], ["3 days or more"]] },

  { k: "radio", q: "A battery-powered or hand-crank radio?", o: [["Yes"], ["No"]] },

      first: days < 1 ? "Water. At 1 gallon per person per day, you'd run out on the first day." : `Water. At 1 gallon per person per day, yours lasts about ${days < 10 ? days.toFixed(1).replace(/\.0$/, "") : Math.floor(days)} day${days === 1 ? "" : "s"}.`,

    light: { s: [0, .5, 1][A.light], w: 1, name: "Light", first: "Light. Phone flashlights drain the one battery you need most.", fix: "Get one flashlight or headlamp per person, plus spare batteries. Battery lights are safer than candles (CDC)." },
    food: { s: [0, .45, 1][A.food] * .8 + (A.opener === 0 ? .2 : 0), w: 1, name: "Food", first: "Food you can eat without cooking.", fix: `Build 3 days of food your family will eat without cooking${A.opener === 0 ? "" : ", and keep a manual can opener with it"}.` },
    co: { s: [1, .5, 0, 0][A.co], w: 1.5, name: "CO safety", first: "Carbon monoxide protection. In outages, generators, grills, and camp stoves make CO.", fix: "Put a battery-powered or battery-backup CO alarm near every sleeping area, and test it monthly (CDC, CPSC)." },
    warm: { s: [1, .5, 0][A.warm], w: 1, name: "Warmth", first: "Warmth. Even gas furnaces need electricity to run.", fix: "Have a warm blanket or sleeping bag for every person (Ready.gov)." },
    news: { s: A.radio === 0 ? 1 : 0, w: .8, name: "News", first: "News. When phones fail, a radio still works.", fix: "Get a battery-powered or hand-crank radio, ideally a NOAA Weather Radio, plus batteries." },

    med: { s: [1, 1, 0][A.med], w: 1.6, name: "Medical", first: "Medical needs: a device or medicine without a plan.", fix: "Ask the doctor or pharmacist for a written plan for a power outage, and ask your power company about its priority restoration list (Ready.gov)." }
  };

    <div class="card small muted">Nothing you answer leaves your phone. The facts behind the score come from FEMA (Ready.gov), the CDC, and the CPSC.</div>

  else if (step < Q.length) { const q = Q[step];
    app.innerHTML = `${top()}<div class="screen"><div class="prog" aria-hidden="true"><i style="width:${step / Q.length * 100}%"></i></div>
      <div class="kick">Question ${step + 1} of ${Q.length}</div><h2 tabindex="-1">${esc(q.q)}</h2>${q.hint ? `<p class="muted small">${esc(q.hint)}</p>` : ""}
      <div class="opts" role="radiogroup">${q.o.map((o, i) => `<button class="opt ${A[q.k] === i ? "on" : ""}" role="radio" aria-checked="${A[q.k] === i}" data-i="${i}">${esc(o[0])}</button>`).join("")}</div>
      <div class="bar"><button class="btn ghost small" id="back">Back</button></div></div>`; }
  else { const r = result(), col = r.score >= 85 ? "#8fd3a2" : r.score >= 50 ? "#f4a93b" : "#ef8a73";
    app.innerHTML = `${top()}<div class="screen"><div class="kick">Your Hour Zero Score</div>
      <div class="score"><div class="dial"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="#1b2536" stroke-width="12"/><circle cx="75" cy="75" r="64" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="402.1" stroke-dashoffset="${402.1 * (1 - r.score / 100)}"/></svg><div class="v"><div><b>${r.score}</b><span>OF 100</span></div></div></div>
        <div><h2 tabindex="-1" style="margin:0 0 6px">${band(r.score)}</h2><p class="muted small" style="margin:0">For ${r.n} ${r.n === 1 ? "person" : "people"}${r.pets ? ` and ${r.pets} pet${r.pets > 1 ? "s" : ""}` : ""}.</p><p class="small" style="margin:8px 0 0"><b>Water:</b> ${r.days < 1 ? "less than 1 day" : "about " + (r.days < 10 ? r.days.toFixed(1).replace(/\.0$/, "") : Math.floor(r.days)) + " day" + (r.days === 1 ? "" : "s")} at 1 gallon per person per day.</p></div></div>
      <div class="card first"><div class="kick">${r.runsOut ? "What would run out first" : "Your biggest gap"}</div><p style="margin:8px 0 0;font-size:19px"><b>${esc(r.first)}</b></p></div>
      ${r.fixes.length ? `<div class="card"><div class="kick" style="margin-bottom:6px">Your first three fixes</div>${r.fixes.map((f, i) => `<div class="fix"><div class="n">${i + 1}</div><div>${esc(f)}</div></div>`).join("")}</div>` : ""}
      <div class="cta">
        <a class="btn" href="${CHECKLIST}" target="_blank" rel="noopener">Free Hour Zero Checklist ${ARROW}</a>
        <a class="btn ghost" href="${BOOK}" target="_blank" rel="noopener">The full guide + family drill</a>
        <div class="grid2"><button class="btn ghost" id="share">Share my score</button><button class="btn ghost" id="again">Retake</button></div>
      </div>
      <div class="foot">Educational only. This score is a guide for your household, not an official rating. Facts: FEMA (Ready.gov), CDC, CPSC, USDA.</div></div>`; }
  wire(); const h = app.querySelector("h2[tabindex]"); if (h) h.focus({ preventScroll: true });
}
function wire() {
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on("go", () => { step = 0; save(); render(); });
  on("back", () => { step = Math.max(-1, step - 1); save(); render(); });
  app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { A[Q[step].k] = +b.dataset.i; b.classList.add("on"); setTimeout(() => { step++; save(); render(); }, 160); });
  on("again", () => { A = {}; step = -1; save(); render(); });
  on("share", share);
}
async function share() {

  x.fillStyle = "#0b0f17"; x.fillRect(0, 0, W, H); const g = x.createRadialGradient(W / 2, 360, 10, W / 2, 360, 520); g.addColorStop(0, "rgba(244,169,59,.40)"); g.addColorStop(1, "rgba(244,169,59,0)"); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.textAlign = "center"; x.fillStyle = "#f4a93b"; x.font = '800 30px "Public Sans", sans-serif'; x.fillText("MY HOUR ZERO SCORE", W / 2, 130);
  x.beginPath(); x.arc(W / 2, 400, 180, 0, Math.PI * 2); x.strokeStyle = "#1b2536"; x.lineWidth = 24; x.stroke();
  x.beginPath(); x.arc(W / 2, 400, 180, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * r.score / 100); x.strokeStyle = r.score >= 85 ? "#8fd3a2" : r.score >= 50 ? "#f4a93b" : "#ef8a73"; x.lineCap = "round"; x.stroke();
  x.fillStyle = "#f4ecdf"; x.font = '700 160px "Literata", serif'; x.fillText(String(r.score), W / 2, 455);
  x.font = '700 50px "Literata", serif'; x.fillText(band(r.score), W / 2, 700);
  x.fillStyle = "#a9b4c6"; x.font = '400 34px "Public Sans", sans-serif'; x.fillText("How long would YOUR home last in a blackout?", W / 2, 800); x.fillText("Take the free 2-minute test.", W / 2, 850);
  x.fillStyle = "#6f7d93"; x.font = '700 26px "Public Sans", sans-serif'; x.fillText("HOUR ZERO READY", W / 2, 1000);
  const blob = await new Promise(res => c.toBlob(res, "image/png")); const url = location.href.split("#")[0];
  const text = `My Hour Zero Score is ${r.score}/100. How long would your home last in a blackout?`;
  try { const file = new File([blob], `Hour_Zero_Score_${r.score}.png`, { type: "image/png" }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text + " " + url }); return; } if (navigator.share) { await navigator.share({ text, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Hour_Zero_Score_${r.score}.png`; document.body.appendChild(a); a.click(); a.remove();
  try { await navigator.clipboard.writeText(text + " " + url); toast("Image saved. Link copied."); } catch (e) { toast("Image saved."); }
}
function toast(m) { const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
render();
})();
