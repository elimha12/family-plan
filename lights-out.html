:root { --night: #0e1a2b; --night-3: #22364f; --lamp: #f4a93b; --ink: #142235; --red: #e78a74; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--night); color: #e7eef6; font: 400 17px/1.55 "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 28px 16px; position: relative; overflow-x: hidden; }
body::before { content: ""; position: fixed; left: 50%; bottom: -45vh; width: 130vh; height: 90vh; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(244,169,59,0.18), rgba(244,169,59,0)); pointer-events: none; }
main { position: relative; width: min(880px, 100%); display: grid; grid-template-columns: 250px 1fr; gap: 48px; align-items: center; }
.cover img { width: 100%; border-radius: 6px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); display: block; }
h1 { font-family: "Literata", Georgia, serif; font-weight: 600; font-size: 42px; line-height: 1.08; letter-spacing: -0.015em; margin: 0 0 12px; color: #fff; }
p { margin: 0 0 14px; color: #c3d0de; }
form { margin-top: 22px; }
label { display: block; font-weight: 600; font-size: 15px; color: #fff; margin-bottom: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
input { flex: 1; min-width: 220px; font: 600 20px/1.2 "Public Sans", system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; padding: 13px 14px; border-radius: 10px; border: 1.5px solid #3b5170; background: #0b1524; color: #fff; }
input:focus { outline: none; border-color: var(--lamp); box-shadow: 0 0 0 3px rgba(244,169,59,0.3); }
button, .btn { font: 700 17px/1 "Public Sans", system-ui, sans-serif; border: 0; border-radius: 10px; padding: 15px 22px; cursor: pointer; background: var(--lamp); color: var(--night); text-decoration: none; display: inline-block; }
button:disabled { opacity: .6; cursor: default; }
.btn.ghost { background: none; color: #fff; border: 1.5px solid #3b5170; padding: 13px 18px; }
.btn.ghost:hover { border-color: var(--lamp); }
.msg { min-height: 1.5em; margin-top: 10px; font-size: 15px; color: var(--red); }
.get { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--night-3); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.get p { margin: 0; font-size: 15px; }
.small { font-size: 13px; color: #8ea0b6; margin-top: 18px; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
@media (max-width: 720px) { main { grid-template-columns: 1fr; gap: 26px; } .cover { width: 150px; } h1 { font-size: 32px; } }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^HZR/, "");
const KEY = "hz-builder-access";
async function open(code) {
  const pass = new TextEncoder().encode(norm(code));
  const base = await crypto.subtle.importKey("raw", pass, "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go"), inp = document.getElementById("code");
if (!window.crypto || !crypto.subtle) { msg.textContent = "This browser can't open the game. Try Safari, Chrome, or Edge, and make sure the address starts with https://."; go.disabled = true; }
f.addEventListener("submit", async e => {
  e.preventDefault(); if (!norm(inp.value)) { msg.textContent = "Type the access code from your purchase receipt."; return; }
  go.disabled = true; go.textContent = "Opening…"; msg.textContent = "";
  try { const html = await open(inp.value); try { localStorage.setItem(KEY, inp.value); } catch (x) {} show(html); }
  catch (err) { go.disabled = false; go.textContent = "Open the game"; msg.textContent = "That code didn't work. Check it against your receipt; dashes and spaces don't matter."; inp.focus(); }
});
(async () => { let saved = null; try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) { try { show(await open(saved)); } catch (x) { try { localStorage.removeItem(KEY); } catch (y) {} } } })();
